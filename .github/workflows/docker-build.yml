# / v3.6.6.
# / This file builds & publishes the HRConvert2 Docker image automatically.
# / Place it at .github/workflows/docker-build.yml in the repository root.
# /
# / WHAT TRIGGERS A BUILD.
# / A push of a version tag such as v3.6.6 builds & publishes that version plus latest.
# / A push to master builds & publishes the edge tag only, so master is testable without
# / moving latest. A pull request builds WITHOUT publishing, so a broken Dockerfile is
# / caught before it is merged rather than after it is released.
# / The workflow can also be started by hand from the Actions tab.
# /
# / WHAT IT DOES NOT DO.
# / It does not update the version stamps inside the source. Those are still edited by
# / hand & the tag must match them, or the core will refuse to run against its own config.
# / -----------------------------------------------------------------------------------

name: Build & Publish Docker Image

on:
  push:
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - master
  workflow_dispatch:

env:
  DOCKERHUB_IMAGE: zelon88/hrconvert2
  GHCR_IMAGE: ghcr.io/zelon88/hrconvert2

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # / Check out the repository so the Dockerfile & build context are available.
      - name: Check out the repository
        uses: actions/checkout@v4

      # / QEMU allows an amd64 runner to build the arm64 image.
      # / The Dockerfile has an arm64 branch for the rar hack, so both are worth building.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # / Buildx is required for multi platform builds & for layer caching.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # / Credentials are only needed when the image will actually be pushed.
      # / A pull request build skips both logins & never touches a registry.
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # / Work out which tags this build should carry.
      # / A version tag produces v3.6.3, 3.6, 3 & latest.
      # / A push to master produces edge only, so master never moves latest.
      - name: Determine image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.DOCKERHUB_IMAGE }}
            ${{ env.GHCR_IMAGE }}
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      # / Build the image.
      # / A pull request builds but does not push, so a broken Dockerfile is caught early.
      # / The cache lives in the GitHub Actions cache & saves most of the 25 minute build
      # / when only the later layers have changed.
      - name: Build & publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Documentation/Build/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            HRCONVERT2_REF=${{ github.sha }}

      # / Confirm the image actually starts & serves a page before it is called good.
      # / A build that succeeds & a container that runs are different things.
      - name: Smoke test the image
        if: github.event_name != 'pull_request'
        run: |
          docker run -d --name hrc2test -p 8080:80 ${{ env.DOCKERHUB_IMAGE }}:${{ steps.meta.outputs.version }}
          sleep 30
          curl --fail --silent --show-error http://localhost:8080/HRProprietary/HRConvert2/convertCore.php > /dev/null
          docker logs hrc2test
          docker stop hrc2test
