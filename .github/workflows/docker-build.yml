# / v4.1.7.
# / This file builds & publishes the HRConvert2 Docker image automatically.
# / Place it at .github/workflows/docker-build.yml in the repository root.
# /
# / WHAT TRIGGERS A BUILD.
# / A push of a version tag such as v3.8.6 builds & publishes that version plus latest.
# / A push to master builds & publishes the edge tag only, so master is testable without
# / moving latest. A pull request builds WITHOUT publishing, so a broken Dockerfile is
# / caught before it is merged rather than after it is released.
# / The workflow can also be started by hand from the Actions tab.
# /
# / THE IMAGE IS BUILT FROM THE CHECKOUT, NOT FROM GITHUB.
# / An earlier Dockerfile cloned the repository & checked out a reference passed in as a
# / build argument, which meant the checkout below was never used & the image never held
# / the code being tested. A pull request could not build at all, because the merge commit
# / it builds against does not exist in a plain clone. The build argument is gone & the
# / Dockerfile copies the context.
# /
# / ONE REGISTRY, DOCKER HUB.
# / The GitHub Container Registry was published to as well & has been removed. Pushing to
# / it needs a package scope the workflow token does not carry by default, & the failure
# / it produces reads as read_package denied on a push, which points at the wrong thing.
# / A second registry publishing the same image earns nothing unless somebody pulls from
# / it. Add it back deliberately, with a token that has the scope, rather than by default.
# /
# / EACH ARCHITECTURE BUILDS ON A RUNNER OF ITS OWN.
# / amd64 builds on ubuntu-latest & arm64 on ubuntu-24.04-arm, so neither is emulated.
# / Under QEMU an arm64 build of FFMPEG from source ran past the six hour limit of a job.
# / Each runner pushes its image by digest, & one last job joins the two digests under the tags.
# / Each architecture keeps a cache of its own, so one never evicts the other.
# / A pull request builds & smoke tests both, & publishes neither.
# /
# / WHAT IT DOES NOT DO.
# / It does not update the version stamps inside the source. Those are still edited by
# / hand & the tag must match them, or the core will refuse to run against its own config.
# / -----------------------------------------------------------------------------------

name: Build & Publish Docker Image

on:
  push:
    branches:
      - master
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - master
  workflow_dispatch:

env:
  DOCKERHUB_IMAGE: zelon88/hrconvert2

jobs:
  # --- STAGE 1: BUILD AND SMOKE TEST EACH ARCHITECTURE ON ITS OWN RUNNER ---
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            cache: linux-amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            cache: linux-arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and load locally
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Documentation/Build/Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: temp-test-image
          cache-from: type=gha,scope=${{ matrix.cache }}
          cache-to: type=gha,scope=${{ matrix.cache }},mode=max

      # / The container is polled rather than slept at, & every diagnostic runs whatever
      # / happened. The step runs under bash -e, so a failing command would end the script
      # / before the diagnostics that explain it.
      # / A question asked of the container says whether it is running before it is asked, &
      # / reports the answer's exit code.
      - name: Smoke test
        run: |
          docker run -d --name hrc2test -p 8080:80 --cap-add SYS_ADMIN temp-test-image
          testPassed=0
          for attempt in $(seq 1 60); do
            if [ -z "$(docker ps --filter name=hrc2test --filter status=running -q)" ]; then
              echo "::error::The container exited after ${attempt}s without answering."
              break
            fi
            if curl --fail --silent --output /dev/null http://localhost:8080/HRProprietary/HRConvert2/convertCore.php; then
              echo "The application answered after ${attempt}s."
              testPassed=1
              break
            fi
            sleep 1
          done
          echo "::group::Container state"
          docker ps -a --filter name=hrc2test --format 'Status={{.Status}}'
          docker inspect hrc2test --format 'State={{.State.Status}} ExitCode={{.State.ExitCode}} Error={{.State.Error}} OOMKilled={{.State.OOMKilled}}' || true
          echo "::endgroup::"
          echo "::group::Container logs"
          docker logs hrc2test 2>&1 || true
          echo "::endgroup::"
          containerRuns=0
          if [ -n "$(docker ps --filter name=hrc2test --filter status=running -q)" ]; then containerRuns=1; fi
          echo "::group::What the image reports about itself"
          if [ "$containerRuns" -eq 1 ]; then
            askExitCode=0
            docker exec hrc2test php /var/www/html/HRProprietary/HRConvert2/convertCore.php -v 2>&1 || askExitCode=$?
            echo "-v ended with exit code ${askExitCode}."
          else
            echo "The container is not running, so it could not be asked."
          fi
          echo "::endgroup::"
          echo "::group::HRConvert2 log"
          if [ "$containerRuns" -eq 1 ]; then
            askExitCode=0
            docker exec hrc2test sh -c 'find /DATA -name "*.log" -exec tail -n 100 {} +' 2>&1 || askExitCode=$?
            echo "Reading the logs ended with exit code ${askExitCode}."
          else
            echo "The container is not running, so it could not be asked."
          fi
          echo "::endgroup::"
          if [ "$testPassed" -ne 1 ]; then
            echo "::error::The smoke test failed. The groups above explain why."
            exit 1
          fi

      - name: Clean up
        if: always()
        run: docker rm -f hrc2test || true

  # --- STAGE 2: PUSH EACH ARCHITECTURE BY DIGEST FROM ITS OWN RUNNER ---
  # / The cache the test above filled is the one read here, so this build is the same image.
  publish:
    needs: test
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            cache: linux-amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            cache: linux-arm64
    runs-on: ${{ matrix.runner }}
    # / The workflow reads the repository & publishes to Docker Hub with a token held in
    # / the repository secrets. It needs no permission over GitHub packages.
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Determine image labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.DOCKERHUB_IMAGE }}

      - name: Build & push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Documentation/Build/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.DOCKERHUB_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.cache }}
          cache-to: type=gha,scope=${{ matrix.cache }},mode=max

      - name: Keep the digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${IMAGE_DIGEST#sha256:}"

      - name: Hand the digest to the merge
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.cache }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # --- STAGE 3: JOIN BOTH ARCHITECTURES UNDER THE TAGS ---
  merge:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Collect the digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # / A tag publishes the version, the major.minor, the major & latest.
      # / A push to master publishes edge & nothing else, so master is installable for
      # / testing without moving the tag everybody else pulls.
      - name: Determine image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/master' }}

      # / Both digests must be present, so a merge never publishes one architecture under a tag that promises two.
      - name: Publish the tags over both architectures
        working-directory: ${{ runner.temp }}/digests
        run: |
          digestCount=$(find . -maxdepth 1 -type f | wc -l)
          if [ "$digestCount" -ne 2 ]; then
            echo "::error::Expected a digest from each of the 2 architectures & found ${digestCount}."
            exit 1
          fi
          tagArguments=$(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          # shellcheck disable=SC2046,SC2086
          docker buildx imagetools create $tagArguments $(printf "${DOCKERHUB_IMAGE}@sha256:%s " *)

      - name: Inspect the published image
        env:
          IMAGE_VERSION: ${{ steps.meta.outputs.version }}
        run: docker buildx imagetools inspect "${DOCKERHUB_IMAGE}:${IMAGE_VERSION}"
